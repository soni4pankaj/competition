<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Admin Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1, h2 { color: #333; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; }
    button:hover { background: #0056b3; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
    th { background: #007bff; color: white; }
    .delete-btn { background: #dc3545; padding: 6px 12px; font-size: 14px; }
    .delete-btn:hover { background: #c82333; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
    .logout-btn { background: #6c757d; }
    .logout-btn:hover { background: #5a6268; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <h1>Admin Dashboard</h1>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <h2>Create New User & Assign Quiz</h2>
    <form id="createUserForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <div class="form-group">
        <label for="role">Role</label>
        <select id="role">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div class="form-group">
        <label for="assignedQuiz">Assigned Quiz Category</label>
        <input type="text" id="assignedQuiz" placeholder="e.g., finance, javascript, default" required>
      </div>
      <button type="submit">Create User</button>
    </form>

    <h2 style="margin-top: 40px;">Existing Users & Quiz Assignments</h2>
    <table>
      <thead>
        <tr>
          <th>Username</th>
          <th>Role</th>
          <th>Assigned Quiz Category</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="userTableBody">
        <!-- Populated via JavaScript -->
      </tbody>
    </table>
  </div>

  <script>
    // Check if logged in as admin
    const currentUser = JSON.parse(localStorage.getItem('currentUser'));
    if (!currentUser || currentUser.role !== 'admin') {
      alert('Unauthorized access! Please log in as admin.');
      window.location.href = 'index.html';
    }

    async function loadUsers() {
      try {
        const res = await fetch('/api/admin/users');
        const data = await res.json();
        if (data.success) {
          const tbody = document.getElementById('userTableBody');
          tbody.innerHTML = '';
          data.users.forEach(user => {
            tbody.innerHTML += `
              <tr>
                <td>${user.username}</td>
                <td>${user.role}</td>
                <td>${user.assignedQuiz || 'default'}</td>
                <td>
                  ${user.username !== currentUser.username ? `<button class="delete-btn" onclick="deleteUser('${user._id}')">Delete</button>` : '<em>Current Admin</em>'}
                </td>
              </tr>
            `;
          });
        }
      } catch (err) {
        console.error('Failed to load users:', err);
      }
    }

    document.getElementById('createUserForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;
      const assignedQuiz = document.getElementById('assignedQuiz').value;

      try {
        const res = await fetch('/api/admin/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, role, assignedQuiz })
        });
        const data = await res.json();
        if (data.success) {
          alert('User created successfully!');
          document.getElementById('createUserForm').reset();
          loadUsers();
        } else {
          alert(data.message);
        }
      } catch (err) {
        alert('Error creating user.');
      }
    });

    async function deleteUser(id) {
      if (!confirm('Are you sure you want to delete this user?')) return;
      try {
        const res = await fetch(`/api/admin/users/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.success) {
          loadUsers();
        } else {
          alert(data.message);
        }
      } catch (err) {
        alert('Error deleting user.');
      }
    }

    function logout() {
      localStorage.removeItem('currentUser');
      window.location.href = 'index.html';
    }

    // Load users on startup
    loadUsers();
  </script>

</body>
</html>
